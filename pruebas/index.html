<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRUEBAS · Approvals</title>

<meta name="theme-color" content="#000000">
<link rel="icon" href="../icons/favicon-32.png?v=4">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png?v=4">
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#1d2330;--mut:#6b7280;--line:#e5e7eb;--pri:#0b0b0b;--pri2:#00857c;--brand:#00afa2;--brand2:#94e0de;--ok:#15803d;--okb:#dcfce7;--warn:#b45309;--warnb:#fef3c7;--bad:#b91c1c;--badb:#fee2e2;--bad2:#7f1d1d;--chip:#eef2f7}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input,textarea{font:inherit}
header{background:#000;border-bottom:2px solid var(--brand);color:#fff;padding:10px 12px 0;position:sticky;top:0;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.htitle{font-weight:700;font-size:16px;flex:1;min-width:150px}
.htitle .logo{height:22px;vertical-align:-4px;margin-right:8px}
.htitle .app{color:var(--brand2);font-weight:700;padding-left:8px;border-left:1px solid #333}
.htitle small{font-weight:400;opacity:.7;font-size:11px;margin-left:4px}
.hbtn.warn{background:#f59e0b;border-color:#f59e0b;color:#111}
.hbtn{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(0,175,162,.55);border-radius:8px;padding:6px 10px;cursor:pointer}
.hsel{background:#fff;color:var(--ink);border:0;border-radius:8px;padding:6px 8px;max-width:180px}
.tabs{display:flex;gap:4px;margin-top:10px;padding:0 2px}
.tab{flex:1;min-width:0;background:#1f2937;color:#cbd5e1;border:1px solid #374151;border-bottom:0;border-radius:10px 10px 0 0;padding:8px 2px 7px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s}
.tab:hover{background:#2b3646;color:#fff}
.tab.on{background:var(--bg);color:var(--ink);border-color:var(--brand);border-top:3px solid var(--brand);padding-top:6px;margin-bottom:-2px;position:relative;z-index:1;font-weight:700}
.tab .ti{margin-right:3px}
@media (max-width:430px){.tab .ti{display:none}.tab{font-size:12.5px}}
@media (max-width:380px){.tabs{gap:3px}.tab{font-size:11.5px;padding-left:0;padding-right:0;letter-spacing:-.2px}}
main{padding:10px 10px 40px;max-width:900px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.kpi{background:var(--card);border-radius:10px;padding:8px 6px;text-align:center;border:1px solid var(--line);cursor:pointer}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:11px;color:var(--mut)}
.kpi.bad b{color:var(--bad)}.kpi.warn b{color:var(--warn)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:4px}
.fchip{white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:5px 10px;cursor:pointer;font-size:13px}
.fchip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.frow{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.frow select,.frow input{flex:1;min-width:120px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.count{font-size:12px;color:var(--mut);margin:2px 2px 6px}
.card{background:var(--card);border-radius:10px;border:1px solid var(--line);border-left:5px solid var(--ok);padding:9px 10px;margin-bottom:7px;display:flex;gap:10px;cursor:pointer}
.card.a8{border-left-color:#d97706}.card.a15{border-left-color:var(--bad)}.card.a30{border-left-color:var(--bad2)}
.card.closed{border-left-color:#9ca3af;opacity:.85}
.cmain{flex:1;min-width:0}
.cname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cname small{font-weight:400;color:var(--mut);font-size:11px}
.cmeta{font-size:12px;color:var(--mut);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.cstate{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.ccom{font-size:12px;color:#374151;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.days{text-align:center;min-width:46px}
.days b{display:block;font-size:22px;line-height:1}
.days span{font-size:10px;color:var(--mut);display:block}
.days .tot{margin-top:3px;font-weight:600;color:#475569}
.fchip.ase{font-weight:600}
.fchip.ase .pend{display:inline-block;min-width:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;padding:0 5px;margin-left:3px;text-align:center}
.fchip.ase.on .pend{background:#fff;color:var(--bad)}
h4.secc{margin:12px 2px 6px;font-size:12px;color:#334155;text-transform:none;letter-spacing:0}
.pill.req{background:transparent;color:#c0c6cf;border:1px solid #e5e7eb;font-weight:500}
.pill.req.on{background:#fff7ed;color:#c2410c;border-color:#fdba74;font-weight:700}
.pill.rea{background:#ecfeff;color:#0e7490;border:1px solid #a5f3fc}
.d0 b{color:var(--ok)}.d8 b{color:#d97706}.d15 b{color:var(--bad)}.d30 b{color:var(--bad2)}
.pill{display:inline-block;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:600;background:var(--chip);color:#334155}
.pill.seg-A{background:#dbeafe;color:#1e40af}.pill.seg-B{background:#ede9fe;color:#5b21b6}.pill.seg-C{background:#fce7f3;color:#9d174d}
.pill.et{background:#e0f2fe;color:#075985}
.pill.et0{background:#f3f4f6;color:#6b7280;border:1px dashed #9ca3af}
.pill.venc{background:var(--badb);color:var(--bad)}
.pill.fok{background:var(--okb);color:var(--ok)}
.pill.rep{background:var(--warnb);color:var(--warn)}
.pill.rep3{background:var(--badb);color:var(--bad)}
.pill.sis{background:#1f2937;color:#fff}
.pill.des{background:var(--okb);color:var(--ok)}
.pill.rech{background:var(--badb);color:var(--bad)}
.pill.flag{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
.empty{text-align:center;color:var(--mut);padding:40px 10px;background:var(--card);border-radius:10px;border:1px dashed var(--line)}
.empty button{margin-top:10px}
.btn{background:var(--pri2);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.sec{background:#e5e7eb;color:var(--ink)}
.btn.red{background:var(--bad)}.btn.green{background:var(--ok)}
.btn:disabled{opacity:.5}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:14px 14px 24px}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:14px}}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.shead h3{margin:0;font-size:17px}
.x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--mut);line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px;margin:10px 0;background:#f9fafb;border-radius:8px;padding:8px 10px}
.grid2 div span{color:var(--mut);font-size:11px;display:block}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.acts .btn{flex:1;min-width:120px;padding:9px 8px;font-size:13px}
.form{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;display:none}
.form.on{display:block}
.form label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.form select,.form input,.form textarea{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}
.form textarea{min-height:56px;resize:vertical}
.form .row{display:flex;gap:6px;margin-top:10px}
.form .row .btn{flex:1}
.err{color:var(--bad);font-size:12px;margin-top:6px;min-height:14px}
.tl{list-style:none;padding:0;margin:8px 0 0;border-left:2px solid var(--line);margin-left:6px}
.tl li{position:relative;padding:0 0 10px 14px}
.tl li::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:#cbd5e1}
.tl li.g::before{background:var(--pri2)}.tl li.r::before{background:var(--warn)}.tl li.x::before{background:var(--bad)}.tl li.ok::before{background:var(--ok)}
.tl .calif{display:inline-block;font-size:11px;font-weight:700;border-radius:8px;padding:1px 7px;margin-bottom:2px}
.cal-cumplido{background:var(--okb);color:var(--ok)}.cal-tarde{background:var(--warnb);color:var(--warn)}.cal-atiempo{background:var(--chip);color:#334155}.cal-incumplido{background:var(--badb);color:var(--bad)}
.tl .when{font-size:11px;color:var(--mut)}
.tl .what{font-weight:600;font-size:13px}
.tl .com{font-size:12px;color:#374151;background:#f9fafb;border-radius:6px;padding:4px 6px;margin-top:3px}
h4{margin:14px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut)}
/* concentrado */
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.erow{display:grid;grid-template-columns:1fr auto 14px;grid-template-areas:'l n g' 'b b g';gap:2px 10px;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.erow:hover{background:#f8fafc}.erow.e0{opacity:.5;cursor:default}
.erow .el{grid-area:l}.erow .el b{display:block;font-size:14px}.erow .el small,.erow .en small{font-size:11px;color:var(--mut)}
.erow .en{grid-area:n;text-align:right}.erow .en b{font-size:20px;margin-right:6px}
.erow .eb{grid-area:b;height:8px;background:#eef2f7;border-radius:4px;overflow:hidden}.erow .eb i{display:block;height:100%;border-radius:4px}
.erow .ego{grid-area:g;color:var(--mut);font-size:18px}
.etab td.lk{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.panel h3{margin:0 0 8px;font-size:15px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600;font-size:11px}
tr.tot td{font-weight:700;background:#f9fafb}
td.m-r{background:#fee2e2;color:#991b1b;font-weight:700}td.m-a{background:#fef3c7;color:#92400e;font-weight:700}td.m-v{background:#dcfce7;color:#166534;font-weight:700}
td.hb{color:var(--bad);font-weight:700}
td.hw{color:var(--warn);font-weight:700}
details summary{cursor:pointer;font-weight:700;font-size:15px}
.bars .b{display:flex;align-items:center;gap:6px;font-size:12px;margin:3px 0}
.bars .b .l{flex:0 0 46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .b .t{flex:1;background:#f3f4f6;border-radius:4px;height:14px;overflow:hidden}
.bars .b .t i{display:block;height:100%}
.bars .b .n{flex:0 0 28px;text-align:right;font-weight:600}
.note{font-size:12px;color:var(--mut);margin:4px 0}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:10px;z-index:40;max-width:92%;font-size:13px;display:none;white-space:pre-line}
.toast.on{display:block}
.menu{position:absolute;right:10px;top:46px;background:#fff;color:var(--ink);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:none;z-index:30;min-width:220px;overflow:hidden}
.menu.on{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.menu button:hover{background:#f3f4f6}
.proto{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:12px;border-radius:8px;padding:6px 8px;margin-bottom:8px}
@keyframes movida{0%{box-shadow:0 0 0 0 rgba(0,175,162,.0);transform:scale(.98)}15%{box-shadow:0 0 0 4px rgba(0,175,162,.9);transform:scale(1.01)}70%{box-shadow:0 0 0 4px rgba(0,175,162,.6)}100%{box-shadow:0 0 0 0 rgba(0,175,162,0);transform:scale(1)}}
.card.movida{animation:movida 3s ease-out;position:relative;overflow:visible}
.movtag{position:absolute;top:-11px;left:10px;z-index:2;background:var(--brand);color:#fff;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2)}
#verMov{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;background:#111827;color:#fff;border-radius:12px;padding:9px 12px;font-size:13px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:92vw}
#verMov button{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer;white-space:nowrap}
footer{text-align:center;font-size:11px;color:var(--mut);padding:16px}
</style>
</head>
<body>
<div style="background:#f59e0b;color:#111;text-align:center;font:700 13px system-ui;padding:6px">⚠ AMBIENTE DE PRUEBAS · datos de prueba, no es la app oficial</div>
<header>
  <div class="hrow">
    <div class="htitle"><img class="logo" src="../icons/crediclub-wordmark.png?v=1" alt="crediclub"><span class="app">Approvals</span><small>v1.1.3</small><small id="who" style="display:block;margin:0;opacity:.85"></small></div>

<script>
'use strict';
/* ================= Config ================= */
const VER='0.8.3', KEY='segAprPRUEBAS_v1', KEYV='segAprPRUEBAS_vista';
const SUCS=['CI-OBLATOS','CI-TLAJOMUCO','CI-TLAQUEPAQUE','CI-TONALA','CI-ZAPOPAN'];
const ETAPAS={
  'Visita asesor':{fecha:'req'},
  'Validación gerente':{fecha:'req'},
  'Se sube a mesa':{fecha:'req'},
  'En mesa':{fecha:'opt'},
  'Por desembolsar':{fecha:'req'},
  'Reagendado':{fecha:'opt',comReq:true}
};
const ETAPA_MESA=['En mesa','Por desembolsar'];
/* nombres del control en Excel -> etapas de la app */
const ETAPA_XL={'visita asesor':'Visita asesor','validacion gerente':'Validación gerente','se sube a mesa':'Se sube a mesa','en mesa':'En mesa','por desembolsar':'Por desembolsar','reagendado':'Reagendado'};
const MOT_REASIG=['Asesor ya no labora / cartera heredada','Asesor sin seguimiento (no se involucra)','Cliente pide otro asesor','Otro'];
const MOT_REPRO=['Cliente no estaba','Cliente pidió cambiar la fecha','Falta documento','Gerente / asesor no llegó','Otro'];
const RECH={
  'Perfil (gerente / asesor)':['No es su negocio / prestanombres','Negocio pequeño / poco inventario','Sin negocio / negocio muy nuevo','Tipo de negocio / perfil no apto','Zona conflictiva / fuera de zona','Historial / atrasos / buró','Sin capacidad de pago','No se ubicó el negocio','Otro'],
  'Mesa de análisis':['Buró','Capacidad de pago','Información inconsistente','Sin detalle','Otro'],
  'Cliente':['Ya no lo quiere / no por el momento','Tasa de interés / le pareció caro','Pospone / se espera','No consiguió aval o documentos','Se fue con otra financiera','No localizable','No le convenció el monto aprobado','Otro'],
};
const CAT_SC='Sin clasificar',CAT_PERFIL='Perfil (gerente / asesor)', CAT_MESA='Mesa de análisis';
/* Clasificación de comentarios libres del control histórico (orden importa) */
const REGLAS=[
  [/mesa|\bmea\b|\brec\. ?mesa/, 'Mesa de análisis', m=>/buro/.test(m)?'Buró':'Sin detalle'],
  [/prestanombre|no es su negocio|no es para ella|la van a operar/, CAT_PERFIL,'No es su negocio / prestanombres'],
  [/peque|pqueñ|pequn|inventario|mercancia/, CAT_PERFIL,'Negocio pequeño / poco inventario'],
  [/no tiene negocio|no presenta negocio|empezando|poco tiempo/, CAT_PERFIL,'Sin negocio / negocio muy nuevo'],
  [/zona/, CAT_PERFIL,'Zona conflictiva / fuera de zona'],
  [/tipo de negocio|perfil|tianguis|taxi|no apto|arraigo|vinos/, CAT_PERFIL,'Tipo de negocio / perfil no apto'],
  [/atraso|pago mal|adeudo|lista negra|buro|grupal|referencias|vobo/, CAT_PERFIL,'Historial / atrasos / buró'],
  [/recursos|no puede pagar|capacidad/, CAT_PERFIL,'Sin capacidad de pago'],
  [/interes|tasa|caro|precio/, 'Cliente','Tasa de interés / le pareció caro'],
  [/\baval\b/, 'Cliente','No consiguió aval o documentos'],
  [/no lo quiere|no quiere|no le interesa|no lo requiere|no por el momento|dejo de operar|sobreendeudar/, 'Cliente','Ya no lo quiere / no por el momento'],
  [/espera|pospone|temporada|meses|fin de mes|liquidar|tramite|ella se comunica/, 'Cliente','Pospone / se espera'],
];
function clasifica(txt){const m=norm(txt);for(const [re,cat,mot] of REGLAS)if(re.test(m))return {cat,motivo:typeof mot==='function'?mot(m):mot};return {cat:CAT_SC,motivo:'Sin motivo especificado'};}
/* Solo estas columnas se guardan. Todo lo demás del export (RFC, teléfono, domicilio, buró) se descarta al cargar. */
const COLS={
  id:['solicitudid'], nombre:['prospectos','prospecto','nombre'], tipo:['tipo solicitud'], est:['estatus'], seg:['segmento'],
  aval:['necesita aval','aval?','aval'], refs:['necesita referencias','referencia?','referencias?','referencia'],
  etapa:['etapa'], xfecha:['fecha'], monto:['monto'], xmesa:['llego a mesa si/no','llego a mesa si / no','llego a mesa'], xfcm:['fecha compromiso mesa'], xcom:['comentario / descripcion','comentario'],
  fsol:['fecha solicitud'], sem:['semana'], fdes:['fecha desembolso'], suc:['sucursal'], safi:['saficreditoid'], asesor:['asesor']
};

/* ================= Utils ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
function hoyISO(){const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
function addDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
function dd(a,b){if(!a||!b)return 0;return Math.round((Date.parse(b+'T12:00:00')-Date.parse(a+'T12:00:00'))/864e5);}
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'],DOW=['dom','lun','mar','mié','jue','vie','sáb'];

async function unzip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf),td=new TextDecoder();
  let e=-1;for(let i=u8.length-22;i>=Math.max(0,u8.length-70000);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break;}}
  if(e<0)throw new Error('El archivo no parece un .xlsx válido');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    files[td.decode(u8.subarray(p+46,p+46+nl))]={method,csize,lo};p+=46+nl+xl+cl;
  }
  return {names:Object.keys(files),async read(name){
    const f=files[name];if(!f)return null;
    const st=f.lo+30+dv.getUint16(f.lo+26,true)+dv.getUint16(f.lo+28,true);const data=u8.subarray(st,st+f.csize);let out;
    if(f.method===0)out=data;
    else if(f.method===8){out=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());}
    else throw new Error('Compresión no soportada');
    return new TextDecoder('utf-8').decode(out).replace(/^﻿/,'');
  }};
}
function dx(s){return s.replace(/&(lt|gt|amp|quot|apos|#x[0-9a-f]+|#\d+);/gi,(m,g)=>{const k=g.toLowerCase();if(k==='lt')return '<';if(k==='gt')return '>';if(k==='amp')return '&';if(k==='quot')return '"';if(k==='apos')return "'";return String.fromCodePoint(k[1]==='x'?parseInt(k.slice(2),16):parseInt(k.slice(1)));});}
function txt(inner){let out='';const re=/<(?:\w+:)?t\b[^>]*?(?:\/>|>([\s\S]*?)<\/(?:\w+:)?t>)/g;let m;const clean=inner.replace(/<(?:\w+:)?rPh\b[\s\S]*?<\/(?:\w+:)?rPh>/g,'');while((m=re.exec(clean)))out+=dx(m[1]||'');return out;}
function colIdx(L){let n=0;for(const ch of L)n=n*26+ch.charCodeAt(0)-64;return n-1;}
function parseSheet(xml,ss){
  const rows=[];const rre=/<(?:\w+:)?row\b([^>]*?)(?:\/>|>([\s\S]*?)<\/(?:\w+:)?row>)/g;let m,ri=0;
  while((m=rre.exec(xml))){
    const ra=/\br="(\d+)"/.exec(m[1]);ri=ra?+ra[1]:ri+1;const cells=[];
    const cre=/<(?:\w+:)?c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/(?:\w+:)?c>)/g;let c,ci=-1;const body=m[2]||'';
    while((c=cre.exec(body))){
      const a=c[1];const rr=/\br="([A-Z]+)\d+"/.exec(a);ci=rr?colIdx(rr[1]):ci+1;
      const t=(/\bt="(\w+)"/.exec(a)||[])[1];const inner=c[2]||'';let v=null;
      if(t==='inlineStr')v=txt(inner);
      else{const vm=/<(?:\w+:)?v>([\s\S]*?)<\/(?:\w+:)?v>/.exec(inner);if(vm){v=dx(vm[1]);if(t==='s')v=ss[+v];else if(t!=='str'&&t!=='e'&&t!=='b'&&v!==''&&!isNaN(v))v=+v;}}
      cells[ci]=v;
    }
    rows[ri-1]=cells;
  }
  return rows;
}
async function readXlsx(buf){
  const z=await unzip(buf);let ss=[];
  const ssx=await z.read('xl/sharedStrings.xml');
  if(ssx){const re=/<(?:\w+:)?si\b[^>]*?(?:\/>|>([\s\S]*?)<\/(?:\w+:)?si>)/g;let m;while((m=re.exec(ssx)))ss.push(txt(m[1]||''));}
  const sheets=z.names.filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort((a,b)=>parseInt(a.match(/\d+/))-parseInt(b.match(/\d+/)));
  const out=[];
  for(const s of sheets){
    const rows=parseSheet(await z.read(s),ss);
    const h=rows.findIndex(r=>r&&r.some(v=>{const n=norm(v);return n==='solicitudid'||n==='solicitud_id';}));
    if(h>=0)out.push({header:rows[h],rows:rows.slice(h+1)});
  }
  if(!out.length)throw new Error('No encontré la columna "SolicitudID" en ninguna hoja');
  return out;
}

    try{await rest(tabla,{method:'POST',body:ch,prefer});}
    catch(e){if(!e.status||e.status>=500||e.status===401)throw e; // red / servidor: reintentar después

    }
  }

  for(const w of ws)if(prev[w]&&cmpSem(w,corte)<0)delete sem[w];
  const pd=(DB.cfg.apv&&DB.cfg.apv.dia)||{},dC=addDays(hoyISO(),-14),dV=addDays(hoyISO(),-200);

}

  const esJ=r=>r&&enR(r[best.iR]);const ixJ=all.map((r,k)=>esJ(r)?k:-1).filter(k=>k>=0);
  let bloques=0;ixJ.forEach((k,n)=>{if(n===0||k!==ixJ[n-1]+1)bloques++;});
  const desde=ixJ[0],hasta=ixJ[ixJ.length-1],unBloque=mezclada&&bloques===1;
  for(const [k,r] of all.entries()){
    if(unBloque&&(k<desde||k>hasta))continue;
    const id=r?idDe(r[best.iId]):'';
    const P=r&&iP>=0&&r[iP]!=null?r[iP]:'',S=r&&iS>=0&&r[iS]!=null?r[iS]:'';
    if(!r||!/^\d+$/.test(id)){out.push(mezclada?[P,S,id,...ext(r,k),r?'Fila con Solicitud_id raro: se deja igual':'Fila vacía'].map(q).join(','):',,,,Fila sin Solicitud_id');continue;}
    const jal=enR(r[best.iR]);
    if(mezclada&&!jal){out.push([P,S,id,...ext(r,k),'Otra región: se deja igual'].map(q).join(','));continue;}
    if(DB.cuentas[id]){const st_=st(id);const stt=col2(st_);if(st_.cierre==='des'||st_.cierre==='desPC')des++;ok++;
      out.push((mezclada?[textoVerdes(st_),stt,id,...ext(r,k),String(r[best.iR]||'').trim()+': llenado desde la app']:[id,textoVerdes(st_),stt,st_.c.nombre,'App']).map(q).join(','));}
    else{sin++;out.push((mezclada?[P,S,id,...ext(r,k),String(r[best.iR]||'').trim()+': sin dato en la app, se deja igual']:[id,'','','','Sin dato en la app']).map(q).join(','));}
  }
  const b=new Blob(['﻿'+out.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='VERDES_'+norm(vistaNombre()).replace(/\s+/g,'_')+'_llenado_'+HOY+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  return {ok,sin,des,total:ok+sin,nP,nS,mezclada,filas:all.length,hoja:best.sh.name||'',bloques,unBloque,desde:desde+2,hasta:hasta+2};
}

function importFile(sheets,archivo){
  const r=blankR();let control=false;

  if(control&&!DB.cfg.inicio){const fs=Object.values(DB.cuentas).map(c=>c.fsol).filter(Boolean).sort();if(fs[0]){DB.cfg.inicio=fs[0];CFG_DIRTY=true;}}

/* Estado derivado de una cuenta: siempre se calcula a partir del historial, nunca se sobrescribe */
/* Orden real de captura: alta → histórico del Excel → lo capturado en la app/sistema (aunque el Excel traiga fechas futuras) */
const evKey=e=>(e.t==='alta'?'0':e.hist?'1':'2')+e.ts;
const ordenEv=a=>[...a].sort((x,y)=>evKey(x).localeCompare(evKey(y)));
function st(id){
  const c=DB.cuentas[id],evs=ordenEv(DB.ev[id]||[]);
  let mesaG=false,mesaH=false;let open=null;const cal=[],calU={};let reacs=0,rechPrev='',fSisDes='';
  let etapa='',fprog='',falta='',repros=0,reasigs=0,asesorAct='',fAsig='',asesorPrev='',lastG='',lastCom='',lastComF='',monto=null,rech=null,mesa=false,desG=null;
  for(const e of evs){
    const ef=e.hist&&c.alta&&e.f>c.alta?c.alta:e.f;
    // ¿Este movimiento resuelve el compromiso abierto? (solo se califica lo capturado en la app o el desembolso del sistema)
    const sisDesEv=e.t==='sis'&&/DESEMB/i.test(e.est||'');if(sisDesEv)fSisDes=e.f;
    if(open&&(e.t==='etapa'||e.t==='repro'||e.t==='des'||e.t==='rech'||sisDesEv)){
      if(!e.hist){let res;
        if(e.t==='repro'||(e.t==='etapa'&&e.etapa==='Reagendado'))res=ef<=open.fprog?'atiempo':'incumplido';
        else if(e.t==='rech')res='';
        else if(sisDesEv)res=dd(open.fprog,ef)<=1?'cumplido':'tarde';
        else res=ef<=open.fprog?'cumplido':'tarde';
        if(res){const x={res,f:ef,fprog:open.fprog,etapa:open.etapa,dias:dd(open.fprog,ef)};cal.push(x);calU[e.uid||e.ts]=x;}}
      open=null;}
    if(e.t==='etapa'||e.t==='repro'){etapa=e.etapa;fprog=e.fprog||(e.hist&&e.f>(c.alta||'')?e.f:'');falta=e.falta||'';if(e.t==='repro')repros++;if(ETAPA_MESA.includes(e.etapa)){mesa=true;mesaG=true;}}
    if(e.mesa){mesa=true;mesaH=true;}
    if(e.t==='reasig'){reasigs++;asesorPrev=e.de;asesorAct=e.a;fAsig=e.f;}
    if(e.t==='rech'){etapa='Rechazado';rech=e.motivo==='Tasa / le pareció caro'?{...e,motivo:'Tasa de interés / le pareció caro'}:e;fprog='';if(e.cat===CAT_MESA){mesa=true;mesaG=true;}}
    if(e.t==='reac'){etapa=e.etapa;fprog=e.fprog||'';rech=null;reacs++;rechPrev=e.antes||rechPrev;}
    if(e.t==='des'){etapa='Desembolsado';desG=e;fprog='';}
    if((e.t==='etapa'||e.t==='repro'||e.t==='reac')&&fprog)open={etapa,fprog};else if(e.t==='des'||e.t==='rech'||sisDesEv)open=null;
    if(e.monto)monto=e.monto;
    if(e.por!=='Sistema')lastG=ef;
    if(e.com){lastCom=e.com;lastComF=ef;}
  }
  const sisDes=/DESEMBOLSADO/i.test(c.est),sisMesa=!sisDes&&(/MESA/i.test(c.est)||!!c.anal||c.ll==='d');
  if(sisMesa||sisDes)mesa=true;
  const mesaFuente=(sisMesa||sisDes)?'sistema':mesaH?'control histórico':mesaG?'según gerente':'';
  let cierre='';if(sisDes)cierre='des';else if(etapa==='Rechazado')cierre='rech';else if(etapa==='Desembolsado')cierre='desPC';
  asesorAct=asesorAct||c.asesor;
  const dias=c.fsol?dd(c.fsol,HOY):0,diasAs=fAsig?dd(fAsig,HOY):null,sinMov=dd(lastG||c.fsol||c.alta,HOY);
  const venc=!cierre&&fprog&&fprog<HOY,hoyC=!cierre&&fprog===HOY;
  const incum=cal.filter(x=>x.res==='incumplido').length;
  let fC='';if(cierre==='des')fC=c.fdes||fSisDes||(desG&&desG.f)||'';else if(cierre==='desPC')fC=desG.f;else if(cierre==='rech')fC=rech.hist&&c.alta&&rech.f>c.alta?c.alta:rech.f;
  const diasCierre=fC&&c.fsol?Math.max(0,dd(c.fsol,fC)):null;
  const conflicto=sisDes&&rech; // estaba rechazado por gerente pero el sistema lo desembolsó
  const desac=!cierre&&GER_MESA.includes(etapa)&&!sisMesa&&(c.ll==='a'||c.ll==='b'||(c.ll==='c'&&etapa!=='Se sube a mesa'));
  return {c,evs,mesaFuente,fC,diasCierre,cal,calU,incum,reacs,rechPrev,desac,reasigs,asesorAct,asesorPrev,fAsig,diasAs,etapa,fprog,falta,repros,lastCom,lastComF,monto,rech,mesa,desG,cierre,dias,sinMov,venc,hoyC,sisMesa,conflicto,abierto:!cierre,sinGestion:!etapa&&!cierre,seg:segL(c.seg)};
}

function aCls(d){return d>30?'30':d>14?'15':d>7?'8':'0';}

const pillMres=s=>s.c.mres==='A'?'<span class="pill sis" style="background:#15803d">Sistema: ✔ autorizado por mesa</span>':'<span class="pill sis" style="background:#b91c1c">Sistema: ✖ no autorizado por mesa</span>';
function estadoPills(s,full){
  if(full===undefined)full=!SIMPLE();

  if(s.cierre==='des')h+=`<span class="pill des">✔ Desembolsado${s.c.fdes?' '+fmt(s.c.fdes,false):''}</span>`;

  else if(s.cierre==='rech')h+=`<span class="pill rech">✖ ${esc(s.rech.motivo)}</span>`;
  else if(s.sinGestion)h+=`<span class="pill et0">Sin gestión</span>`;
  else h+=`<span class="pill et">${esc(s.etapa)}${s.falta?' · '+esc(s.falta):''}</span>`;
  if(s.fprog&&s.abierto)h+=`<span class="pill ${s.venc?'venc':'fok'}">${s.venc?'⚠ vencido ':s.hoyC?'hoy ':''}${fmt(s.fprog)}</span>`;
  if(!full){ // modo sencillo: una sola alerta, la más importante
    if(s.desac)h+=`<span class="pill rech">⚠ No cuadra con sistema</span>`;
    else if(s.incum)h+=`<span class="pill rep">✖ ${s.incum} incumplido${s.incum>1?'s':''}</span>`;
    else if(s.abierto&&s.c.mres)h+=pillMres(s);
    else if(s.abierto&&s.c.ll&&LLEN[s.c.ll]&&s.c.ll!=='e'&&!s.sisMesa)h+=`<span class="pill sis">Sistema: ${LLEN[s.c.ll]}</span>`;
    return h;}
  if(s.repros)h+=`<span class="pill ${s.repros>=3?'rep3':'rep'}">↻ ${s.repros} ${s.repros===1?'vez':'veces'}</span>`;
  if(s.abierto&&s.c.mres)h+=pillMres(s);
  else if(s.sisMesa&&s.abierto)h+=`<span class="pill sis">Sistema: en mesa</span>`;
  else if(s.abierto&&s.c.ll&&LLEN[s.c.ll]&&s.c.ll!=='e')h+=`<span class="pill sis">Sistema: ${LLEN[s.c.ll]}</span>`;
  if(s.desac)h+=`<span class="pill rech">⚠ No cuadra con sistema</span>`;
  if(s.reacs)h+=`<span class="pill rea">↺ reactivada${s.reacs>1?' '+s.reacs+'×':''}</span>`;

const C={sem:''};
function metr(arr){
  const m={acept:arr.length,sc:0,conf:0,des:0,desPC:0,perfil:0,mesaR:0,cli:0,otro:0,ab:0,a15:0,a30:0,venc:0,rep:0,sing:0,sinMesa:0};
  for(const s of arr){
    if(s.cierre==='des')m.des++;else if(s.cierre==='desPC'){m.des++;m.desPC++;}
    else if(s.cierre==='rech'){const c=s.rech.cat;if(c===CAT_PERFIL)m.perfil++;else if(c===CAT_MESA)m.mesaR++;else if(c==='Cliente')m.cli++;else m.otro++;if(c===CAT_SC)m.sc++;if(!s.mesa&&(!s.rech.hist||s.rech.mesaNo))m.sinMesa++;}
    if(s.conflicto)m.conf++;
    if(s.abierto){m.ab++;if(s.dias>30)m.a30++;else if(s.dias>14)m.a15++;if(s.venc)m.venc++;if(s.repros>=2)m.rep++;if(s.sinGestion)m.sing++;}
  }
  m.rech=m.perfil+m.mesaR+m.cli+m.otro;m.dc=cierre30(arr).prom;return m;
}

  $('#ePer').onchange=e=>{E.per=e.target.value;if(E.per==='pers'&&!E.desde){E.desde=HOY.slice(0,8)+'01';E.hasta=HOY;}renderEmb();};
  const fch=(id,k)=>{$(id).onchange=e=>{E.per='pers';E[k]=e.target.value;renderEmb();};};fch('#eDe','desde');fch('#eHa','hasta');
  if($('#eBack'))$('#eBack').onclick=()=>{if(E.ase)E.ase='';else if(E.suc)E.suc='';else E.reg='';renderEmb();};
  if($('#eCsv'))$('#eCsv').onclick=exportaCSV;
  el.querySelectorAll('.erow[data-k]').forEach(d=>d.onclick=()=>{if(T[d.dataset.k])irPend(d.dataset.k,sc0);});
  el.querySelectorAll('td[data-g]').forEach(td=>td.onclick=()=>{const k=td.dataset.g;if(gAttr==='ase')E.ase=k;else if(gAttr==='suc')E.suc=k;else E.reg=k;renderEmb();window.scrollTo(0,0);});
  el.querySelectorAll('td[data-c]').forEach(td=>td.onclick=()=>irPend(td.dataset.c,td.dataset.gk?scOf(td.dataset.gk):sc0));
}
const ALZA_TASA='2026-10-16'; // fecha del alza de tasas, para comparar antes / después
function tasaHTML(all){const r=all.filter(s=>s.cierre==='rech'&&/^Tasa/.test(s.rech.motivo||''));
  const antes=r.filter(s=>s.rech.hist||(s.rech.f||'')<ALZA_TASA).length,desp=r.length-antes;
  return `<p class="note" style="margin-top:6px">💲 <b>Rechazo por tasa de interés:</b> ${antes} antes del ${fmt(ALZA_TASA,false)} · <b>${desp}</b> desde el alza de tasas.</p>`;}
function renderConcSimple(all){
  const ab=all.filter(s=>s.abierto),c30=cierre30(all),pa=promAb(all);
  const g={};all.forEach(s=>{const k=s.asesorAct||'(sin asesor)';(g[k]=g[k]||[]).push(s);});
  const rows=Object.keys(g).map(k=>{const a=g[k],o=a.filter(s=>s.abierto),c=cierre30(a);return {k,ab:o.length,a30:o.filter(s=>s.dias>30).length,venc:o.filter(s=>s.venc).length,sg:o.filter(s=>s.sinGestion).length,pa:promAb(a),cn:c.n,cp:c.prom};}).sort((a,b)=>(b.pa??0)-(a.pa??0));
  $('#vConc').innerHTML=`
  <div class="kpis">
    <div class="kpi"><b>${ab.length}</b><span>Abiertos</span></div>
    <div class="kpi ${pa>14?'bad':pa>7?'warn':''}"><b>${pa??'—'}</b><span>Días prom. abiertos</span></div>
    <div class="kpi"><b>${c30.n}</b><span>Cerradas 30 días</span></div>
    <div class="kpi"><b style="color:var(--ok)">${c30.prom??'—'}</b><span>Días prom. para cerrar</span></div>
  </div>
  <div class="panel"><h3>Por asesor</h3><div class="tw"><table>
    <tr><th>Asesor</th><th>Abiertos</th><th>Sin gest.</th><th>Venc.</th><th>+30d</th><th>Días prom. abiertos</th><th>Cerradas 30d</th><th>Días para cerrar</th></tr>
    ${rows.map(r=>`<tr><td>${esc(r.k)}</td><td>${r.ab}</td><td class="${r.sg?'hw':''}">${r.sg}</td><td class="${r.venc?'hb':''}">${r.venc}</td><td class="${r.a30?'hb':''}">${r.a30}</td><td class="${r.pa>14?'hb':r.pa>7?'hw':''}">${r.pa??'—'}</td><td>${r.cn}</td><td>${r.cp??'—'}</td></tr>`).join('')}
  </table></div>
  <p class="note">La meta: que cada aceptado llegue rápido a <b>desembolsado</b> o <b>rechazado con motivo</b>. Menos días = mejor. "Días para cerrar" cuenta desde la solicitud hasta el cierre, de las cuentas cerradas en los últimos 30 días.</p></div>`;
}
function renderConc(){
  const all0=visibles();
  if(SIMPLE())return renderConcSimple(all0);
  if(!all0.length){$('#vConc').innerHTML='<div class="empty">Carga primero el export del funnel.</div>';return;}
  const sems=[...new Set(all0.map(s=>s.c.sem))].filter(Boolean).sort().reverse();
  if(C.sem&&!sems.includes(C.sem))C.sem='';
  const all=all0.filter(s=>!C.sem||s.c.sem===C.sem);
  const T=metr(all);
  const grp=(key)=>{const g={};all.forEach(s=>{const k=key(s)||'(sin dato)';(g[k]=g[k]||[]).push(s);});return g;};
  const bySuc=grp(s=>s.c.suc),byAse=grp(s=>s.asesorAct),bySeg=grp(s=>s.seg?'Aceptado '+s.seg:'');
  const rowSuc=(name,m,tot)=>`<tr class="${tot?'tot':''}"><td>${esc(name.replace('CI-',''))}</td><td>${m.acept}</td><td>${m.des}</td><td>${pct(m.des,m.acept)}</td><td>${m.rech}</td><td class="${m.perfil?'hw':''}">${m.perfil}</td><td>${m.ab}</td><td class="${m.a15?'hw':''}">${m.a15}</td><td class="${m.a30?'hb':''}">${m.a30}</td><td class="${m.venc?'hb':''}">${m.venc}</td><td class="${m.rep?'hw':''}">${m.rep}</td><td>${m.sing}</td><td><b>${m.dc??'—'}</b></td></tr>`;
  const sucRows=Object.keys(bySuc).sort().map(k=>rowSuc(k,metr(bySuc[k]))).join('');
  const quit={};all.forEach(s=>s.evs.forEach(e=>{if(e.t==='reasig')quit[e.de]=(quit[e.de]||0)+1;}));
  const ases=[...new Set([...Object.keys(byAse),...Object.keys(quit)])].map(k=>({k,m:metr(byAse[k]||[]),suc:(byAse[k]||all.filter(s=>s.evs.some(e=>e.de===k)))[0].c.suc,q:quit[k]||0})).sort((a,b)=>(b.m.perfil-a.m.perfil)||(b.m.ab-a.m.ab));
  const mot={};all.filter(s=>s.cierre==='rech').forEach(s=>{const k=s.rech.motivo+(s.rech.cat===CAT_PERFIL||s.rech.cat===CAT_SC?'':' ('+s.rech.cat.split(' ')[0].toLowerCase()+')');mot[k]=(mot[k]||0)+1;});
  const motA=Object.entries(mot).sort((a,b)=>b[1]-a[1]);const motMax=motA[0]?.[1]||1;
  const segRows=Object.keys(bySeg).sort().map(k=>{const m=metr(bySeg[k]);return `<tr><td>${esc(k)}</td><td>${m.acept}</td><td>${m.des}</td><td>${pct(m.des,m.acept)}</td><td>${m.perfil}</td><td>${m.ab}</td></tr>`;}).join('');
  $('#vConc').innerHTML=`
  <div class="frow"><select id="cSem"><option value="">Todas las semanas de solicitud</option>${sems.map(x=>`<option ${C.sem===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
  <div class="kpis">
    <div class="kpi"><b>${T.acept}</b><span>Aceptados</span></div>
    <div class="kpi"><b style="color:var(--ok)">${pct(T.des,T.acept)}</b><span>Conversión (${T.des})</span></div>
    <div class="kpi ${T.perfil?'warn':''}"><b>${T.perfil}</b><span>Rech. por perfil</span></div>
    <div class="kpi ${T.a30?'bad':''}"><b>${T.ab}</b><span>Abiertos (${T.a30} +30d)</span></div>
  </div>
  ${VISTA==='GP'?`<div class="panel"><h3>Por región</h3><div class="tw"><table>
    <tr><th></th><th>Acept.</th><th>Desemb.</th><th>Conv.</th><th>Rech.</th><th>Perfil</th><th>Abiertos</th><th>15-30d</th><th>+30d</th><th>Venc.</th><th>↻2+</th><th>Sin gest.</th><th>Días cierre 30d</th></tr>
    ${Object.entries(grp(s=>tit(REG(s.c.suc))||'(sin región)')).sort().map(([k,v])=>rowSuc(k,metr(v))).join('')}${rowSuc('Total subdirección',T,true)}</table></div></div>`:''}
  <div class="panel"><details ${VISTA==='GP'?'':'open'}><summary><h3 style="display:inline">Por sucursal</h3></summary><div class="tw"><table>
    <tr><th></th><th>Acept.</th><th>Desemb.</th><th>Conv.</th><th>Rech.</th><th>Perfil</th><th>Abiertos</th><th>15-30d</th><th>+30d</th><th>Venc.</th><th>↻2+</th><th>Sin gest.</th><th>Días cierre 30d</th></tr>
    ${sucRows}${MULTI()?rowSuc('Total '+vistaNombre(),T,true):''}
  </table></div></details>
  <p class="note">Por asesor se cuenta con el asesor actual (después de reasignar). <b>↔ Quitadas</b> = cuentas que se le reasignaron a otro.</p>
  <p class="note"><b>Perfil</b> = rechazado por gerente/asesor (no cumplía el perfil: ¿para qué se pidió el approval?). <b>Venc.</b> = fecha compromiso ya pasada. ${T.sinMesa?`<b>${T.sinMesa}</b> rechazos sin llegar a mesa.`:''}${T.desPC?` <b>${T.desPC}</b> desembolsos por confirmar en sistema.`:''}${T.conf?` <b style="color:var(--bad)">${T.conf}</b> cuentas rechazadas que el sistema marca desembolsadas.`:''}${T.sc?` <b>${T.sc}</b> rechazos históricos sin motivo especificado.`:''}</p></div>
  ${compHTML(all0)}
  ${benchHTML()}
  <div class="panel"><h3>Por segmento</h3><div class="tw"><table><tr><th></th><th>Acept.</th><th>Desemb.</th><th>Conv.</th><th>Perfil</th><th>Abiertos</th></tr>${segRows}</table></div></div>
  <div class="panel"><h3>Motivos de rechazo</h3>${motA.length?`<div class="bars">${motA.slice(0,12).map(([k,n])=>`<div class="b"><span class="l" title="${esc(k)}">${esc(k)}</span><span class="t"><i style="width:${n*100/motMax}%;background:${/\(/.test(k)?'#94a3b8':'#d97706'}"></i></span><span class="n">${n}</span></div>`).join('')}</div><p class="note">Naranja = perfil (gerente/asesor) · Gris = mesa / cliente / otro</p>${tasaHTML(all)}`:'<p class="note">Aún no hay rechazos capturados.</p>'}</div>
  <div class="panel"><details ${!MULTI()?'open':''}><summary>Por asesor (${ases.length})</summary><div class="tw" style="margin-top:8px"><table>
    <tr><th>Asesor</th>${MULTI()?'<th>Suc.</th>':''}<th>Acept.</th><th>Desemb.</th><th>Conv.</th><th>Perfil</th><th>% perfil</th><th>Abiertos</th><th>+30d</th><th>↔ Quitadas</th></tr>
    ${ases.map(a=>`<tr><td>${esc(a.k)}</td>${MULTI()?`<td>${esc(a.suc.replace('CI-',''))}</td>`:''}<td>${a.m.acept}</td><td>${a.m.des}</td><td>${pct(a.m.des,a.m.acept)}</td><td class="${a.m.perfil?'hw':''}">${a.m.perfil}</td><td class="${a.m.acept&&a.m.perfil/a.m.acept>=.2?'hb':''}">${pct(a.m.perfil,a.m.acept)}</td><td>${a.m.ab}</td><td class="${a.m.a30?'hb':''}">${a.m.a30}</td><td class="${a.q?'hw':''}">${a.q}</td></tr>`).join('')}
  </table></div></details></div>`;
  $('#cSem').onchange=e=>{C.sem=e.target.value;renderConc();};
  const cd=$('#cDesde');if(cd)cd.onchange=e=>{C.desde=e.target.value;renderConc();};
  const cp=$('#cPer');if(cp)cp.onchange=e=>{C.cper=e.target.value;renderConc();};
}

reindex();fillVista();
if(SES&&SES.perfil){aplicaPerfil();render();sincroniza(false);}else{render();showLogin();}
// Copia guardada para abrir aunque no haya señal (mismo esquema que la Agenda del Asesor)
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>{Promise.reject().catch(()=>{});});}
</script>
</body>
