<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba de conexión</title>
<style>
body{margin:0;font:15px/1.4 system-ui,Roboto,sans-serif;background:#f3f4f6;color:#1d2330;padding:16px}
h1{font-size:18px;margin:0 0 4px}p{color:#6b7280;font-size:13px;margin:0 0 14px}
.r{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.r b{font-size:14px}.r small{display:block;color:#6b7280;font-size:12px}
.s{font-weight:700;white-space:nowrap}.ok{color:#15803d}.no{color:#b91c1c}.wait{color:#9ca3af}
button{width:100%;padding:12px;border:0;border-radius:10px;background:#0f3d6e;color:#fff;font-weight:700;font-size:15px;margin-top:6px}
input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd5e1;border-radius:8px;margin-top:6px}
details{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;margin-top:10px}
#res{margin-top:12px;background:#111827;color:#fff;border-radius:10px;padding:12px;font-size:13px;white-space:pre-line;display:none}
footer{text-align:center;font-size:11px;color:#6b7280;margin-top:16px}
</style></head><body>
<h1>Prueba de conexión</h1>
<p>Ábrela en el celular de la empresa con datos móviles y después con WiFi, y mándame captura del resultado.</p>
<div id="list"></div>
<details id="det"><summary>Proyecto Supabase</summary>
<input id="u" placeholder="https://xxxx.supabase.co"><input id="k" placeholder="anon key (pública)"></details>
<button id="go">Probar de nuevo</button>
<div id="res"></div>
<footer>created by Joe Fdz &amp; Claude !!</footer>
<script>
const T=[
 ['GitHub Pages','jose2811.github.io','https://jose2811.github.io/agenda-asesor/'],
 ['Google Apps Script','script.google.com (buzón)','https://script.google.com/favicon.ico'],
 ['Supabase (sitio)','supabase.com','https://supabase.com/favicon/favicon-32x32.png'],
];
function row(i,n,d){return `<div class="r"><div><b>${n}</b><small>${d}</small></div><span class="s wait" id="s${i}">…</span></div>`;}
async function probe(url){const t0=performance.now();const c=new AbortController();const to=setTimeout(()=>c.abort(),8000);
 try{await fetch(url,{mode:'no-cors',cache:'no-store',signal:c.signal});clearTimeout(to);return {ok:true,ms:Math.round(performance.now()-t0)};}
 catch(e){clearTimeout(to);return {ok:false,err:e.name==='AbortError'?'tiempo agotado':'bloqueado / sin red'};}}
async function run(){
 const tests=[...T];const u=document.getElementById('u').value.trim().replace(/\/$/,''),k=document.getElementById('k').value.trim();
 if(u)tests.push(['Tu proyecto Supabase',u.replace('https://',''),u]);
 document.getElementById('list').innerHTML=tests.map((t,i)=>row(i,t[0],t[1])).join('');
 const out=[];
 for(let i=0;i<tests.length;i++){
   let r;
   if(i===T.length&&u){ // prueba real: si responde con cualquier código HTTP, el dominio NO está bloqueado // prueba real con la API del proyecto
     try{const res=await fetch(u+'/rest/v1/',{headers:k?{apikey:k,Authorization:'Bearer '+k}:{}});r={ok:true,ms:0,code:res.status};}catch(e){r={ok:false,err:'bloqueado / sin red'};}
   } else r=await probe(tests[i][2]);
   const el=document.getElementById('s'+i);el.className='s '+(r.ok?'ok':'no');el.textContent=r.ok?('✔ OK'+(r.code?' ('+r.code+')':'')):'✖ '+r.err;
   out.push((r.ok?'✔ ':'✖ ')+tests[i][0]+(r.ok?'':' — '+r.err));
 }
 const ls=(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return true;}catch(e){return false;}})();
 out.push((ls?'✔ ':'✖ ')+'Almacenamiento local');
 out.push((navigator.onLine?'✔ ':'✖ ')+'En línea');
 out.push('Navegador: '+navigator.userAgent.replace(/^.*?\((.*?)\).*?(Chrome\/[\d.]+).*$/,'$1 · $2'));
 out.push(new Date().toLocaleString('es-MX'));
 const r=document.getElementById('res');r.style.display='block';r.textContent=out.join('\n');
}
// Permite pasar el proyecto en la liga: ?u=https://xxxx.supabase.co&k=ANON_KEY
const qs=new URLSearchParams(location.search);
const PRE_U='https://zvnrtsowckhkfvrjzfcf.supabase.co',PRE_K='';
const U0=qs.get('u')||PRE_U,K0=qs.get('k')||PRE_K;
if(U0){document.getElementById('u').value=U0;document.getElementById('k').value=K0;document.getElementById('det').open=true;}
document.getElementById('go').onclick=run;run();
</script></body></html>
