<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seguimiento a Aceptados</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f3d6e">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#1d2330;--mut:#6b7280;--line:#e5e7eb;--pri:#0f3d6e;--pri2:#1d5fa3;--ok:#15803d;--okb:#dcfce7;--warn:#b45309;--warnb:#fef3c7;--bad:#b91c1c;--badb:#fee2e2;--bad2:#7f1d1d;--chip:#eef2f7}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input,textarea{font:inherit}
header{background:var(--pri);color:#fff;padding:10px 12px 0;position:sticky;top:0;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.htitle{font-weight:700;font-size:16px;flex:1;min-width:150px}
.htitle small{font-weight:400;opacity:.7;font-size:11px;margin-left:4px}
.hbtn.warn{background:#f59e0b;border-color:#f59e0b;color:#111}
.hbtn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 10px;cursor:pointer}
.hsel{background:#fff;color:var(--ink);border:0;border-radius:8px;padding:6px 8px;max-width:180px}
.tabs{display:flex;gap:4px;margin-top:8px}
.tab{flex:1;background:transparent;color:#cfe0f3;border:0;border-bottom:3px solid transparent;padding:8px 4px;cursor:pointer;font-weight:600}
.tab.on{color:#fff;border-bottom-color:#fff}
main{padding:10px 10px 40px;max-width:900px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.kpi{background:var(--card);border-radius:10px;padding:8px 6px;text-align:center;border:1px solid var(--line);cursor:pointer}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:11px;color:var(--mut)}
.kpi.bad b{color:var(--bad)}.kpi.warn b{color:var(--warn)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:4px}
.fchip{white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:5px 10px;cursor:pointer;font-size:13px}
.fchip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.frow{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.frow select,.frow input{flex:1;min-width:120px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.count{font-size:12px;color:var(--mut);margin:2px 2px 6px}
.card{background:var(--card);border-radius:10px;border:1px solid var(--line);border-left:5px solid var(--ok);padding:9px 10px;margin-bottom:7px;display:flex;gap:10px;cursor:pointer}
.card.a8{border-left-color:#d97706}.card.a15{border-left-color:var(--bad)}.card.a30{border-left-color:var(--bad2)}
.card.closed{border-left-color:#9ca3af;opacity:.85}
.cmain{flex:1;min-width:0}
.cname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cname small{font-weight:400;color:var(--mut);font-size:11px}
.cmeta{font-size:12px;color:var(--mut);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.cstate{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.ccom{font-size:12px;color:#374151;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.days{text-align:center;min-width:46px}
.days b{display:block;font-size:22px;line-height:1}
.days span{font-size:10px;color:var(--mut);display:block}
.days .tot{margin-top:3px;font-weight:600;color:#475569}
.pill.rea{background:#ecfeff;color:#0e7490;border:1px solid #a5f3fc}
.d0 b{color:var(--ok)}.d8 b{color:#d97706}.d15 b{color:var(--bad)}.d30 b{color:var(--bad2)}
.pill{display:inline-block;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:600;background:var(--chip);color:#334155}
.pill.seg-A{background:#dbeafe;color:#1e40af}.pill.seg-B{background:#ede9fe;color:#5b21b6}.pill.seg-C{background:#fce7f3;color:#9d174d}
.pill.et{background:#e0f2fe;color:#075985}
.pill.et0{background:#f3f4f6;color:#6b7280;border:1px dashed #9ca3af}
.pill.venc{background:var(--badb);color:var(--bad)}
.pill.fok{background:var(--okb);color:var(--ok)}
.pill.rep{background:var(--warnb);color:var(--warn)}
.pill.rep3{background:var(--badb);color:var(--bad)}
.pill.sis{background:#1f2937;color:#fff}
.pill.des{background:var(--okb);color:var(--ok)}
.pill.rech{background:var(--badb);color:var(--bad)}
.pill.flag{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
.empty{text-align:center;color:var(--mut);padding:40px 10px;background:var(--card);border-radius:10px;border:1px dashed var(--line)}
.empty button{margin-top:10px}
.btn{background:var(--pri2);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.sec{background:#e5e7eb;color:var(--ink)}
.btn.red{background:var(--bad)}.btn.green{background:var(--ok)}
.btn:disabled{opacity:.5}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:14px 14px 24px}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:14px}}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.shead h3{margin:0;font-size:17px}
.x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--mut);line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px;margin:10px 0;background:#f9fafb;border-radius:8px;padding:8px 10px}
.grid2 div span{color:var(--mut);font-size:11px;display:block}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.acts .btn{flex:1;min-width:120px;padding:9px 8px;font-size:13px}
.form{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;display:none}
.form.on{display:block}
.form label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.form select,.form input,.form textarea{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}
.form textarea{min-height:56px;resize:vertical}
.form .row{display:flex;gap:6px;margin-top:10px}
.form .row .btn{flex:1}
.err{color:var(--bad);font-size:12px;margin-top:6px;min-height:14px}
.tl{list-style:none;padding:0;margin:8px 0 0;border-left:2px solid var(--line);margin-left:6px}
.tl li{position:relative;padding:0 0 10px 14px}
.tl li::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:#cbd5e1}
.tl li.g::before{background:var(--pri2)}.tl li.r::before{background:var(--warn)}.tl li.x::before{background:var(--bad)}.tl li.ok::before{background:var(--ok)}
.tl .when{font-size:11px;color:var(--mut)}
.tl .what{font-weight:600;font-size:13px}
.tl .com{font-size:12px;color:#374151;background:#f9fafb;border-radius:6px;padding:4px 6px;margin-top:3px}
h4{margin:14px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut)}
/* concentrado */
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.panel h3{margin:0 0 8px;font-size:15px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600;font-size:11px}
tr.tot td{font-weight:700;background:#f9fafb}
td.hb{color:var(--bad);font-weight:700}
td.hw{color:var(--warn);font-weight:700}
details summary{cursor:pointer;font-weight:700;font-size:15px}
.bars .b{display:flex;align-items:center;gap:6px;font-size:12px;margin:3px 0}
.bars .b .l{flex:0 0 46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .b .t{flex:1;background:#f3f4f6;border-radius:4px;height:14px;overflow:hidden}
.bars .b .t i{display:block;height:100%}
.bars .b .n{flex:0 0 28px;text-align:right;font-weight:600}
.note{font-size:12px;color:var(--mut);margin:4px 0}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:10px;z-index:40;max-width:92%;font-size:13px;display:none;white-space:pre-line}
.toast.on{display:block}
.menu{position:absolute;right:10px;top:46px;background:#fff;color:var(--ink);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:none;z-index:30;min-width:220px;overflow:hidden}
.menu.on{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.menu button:hover{background:#f3f4f6}
.proto{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:12px;border-radius:8px;padding:6px 8px;margin-bottom:8px}
footer{text-align:center;font-size:11px;color:var(--mut);padding:16px}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="htitle">Seguimiento a Aceptados<small>v0.4.1</small><small id="who" style="display:block;margin:0;opacity:.85"></small></div>
    <select id="vista" class="hsel" title="Vista" hidden></select>
    <button class="hbtn" id="bSync" hidden>☁</button>
    <button class="hbtn" id="bImport" hidden>📥 Cargar export</button>
    <button class="hbtn" id="bMenu">⋯</button>
  </div>
  <div class="tabs">

    <button id="mExp">💾 Descargar respaldo (JSON)</button>

  </div>
</header>
<input type="file" id="fx" accept=".xlsx" hidden>
<input type="file" id="fj" accept=".json,application/json" hidden>

<main>
  <section id="vLista"></section>
  <section id="vConc" hidden></section>
</main>
<footer>created by Joe Fdz &amp; Claude !!</footer>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script>
'use strict';
/* ================= Config ================= */
const VER='0.4.1', KEY='segAceptados_v1', KEYV='segAceptados_vista';
const SUCS=['CI-OBLATOS','CI-TLAJOMUCO','CI-TLAQUEPAQUE','CI-TONALA','CI-ZAPOPAN'];
const ETAPAS={
  'Visita asesor':{fecha:'req'},
  'Validación gerente':{fecha:'req'},
  'Se sube a mesa':{fecha:'req'},
  'En mesa':{fecha:'opt'},
  'Por desembolsar':{fecha:'req'},
  'Reagendado':{fecha:'opt',comReq:true}
};
const ETAPA_MESA=['En mesa','Por desembolsar'];
/* nombres del control en Excel -> etapas de la app */
const ETAPA_XL={'visita asesor':'Visita asesor','validacion gerente':'Validación gerente','se sube a mesa':'Se sube a mesa','en mesa':'En mesa','por desembolsar':'Por desembolsar','reagendado':'Reagendado'};
const MOT_REASIG=['Asesor ya no labora / cartera heredada','Asesor sin seguimiento (no se involucra)','Cliente pide otro asesor','Otro'];
const MOT_REPRO=['Cliente no estaba','Cliente pidió cambiar la fecha','Falta documento','Gerente / asesor no llegó','Otro'];
const RECH={
  'Perfil (gerente / asesor)':['No es su negocio / prestanombres','Negocio pequeño / poco inventario','Sin negocio / negocio muy nuevo','Tipo de negocio / perfil no apto','Zona conflictiva / fuera de zona','Historial / atrasos / buró','Sin capacidad de pago','No se ubicó el negocio','Otro'],
  'Mesa de análisis':['Buró','Capacidad de pago','Información inconsistente','Sin detalle','Otro'],
  'Cliente':['Ya no lo quiere / no por el momento','Tasa / le pareció caro','Pospone / se espera','No consiguió aval o documentos','Se fue con otra financiera','No localizable','No le convenció el monto aprobado','Otro'],
};
const CAT_SC='Sin clasificar',CAT_PERFIL='Perfil (gerente / asesor)', CAT_MESA='Mesa de análisis';
/* Clasificación de comentarios libres del control histórico (orden importa) */
const REGLAS=[
  [/mesa|\bmea\b|\brec\. ?mesa/, 'Mesa de análisis', m=>/buro/.test(m)?'Buró':'Sin detalle'],
  [/prestanombre|no es su negocio|no es para ella|la van a operar/, CAT_PERFIL,'No es su negocio / prestanombres'],
  [/peque|pqueñ|pequn|inventario|mercancia/, CAT_PERFIL,'Negocio pequeño / poco inventario'],
  [/no tiene negocio|no presenta negocio|empezando|poco tiempo/, CAT_PERFIL,'Sin negocio / negocio muy nuevo'],
  [/zona/, CAT_PERFIL,'Zona conflictiva / fuera de zona'],
  [/tipo de negocio|perfil|tianguis|taxi|no apto|arraigo|vinos/, CAT_PERFIL,'Tipo de negocio / perfil no apto'],
  [/atraso|pago mal|adeudo|lista negra|buro|grupal|referencias|vobo/, CAT_PERFIL,'Historial / atrasos / buró'],
  [/recursos|no puede pagar|capacidad/, CAT_PERFIL,'Sin capacidad de pago'],
  [/interes|tasa|caro|precio/, 'Cliente','Tasa / le pareció caro'],
  [/\baval\b/, 'Cliente','No consiguió aval o documentos'],
  [/no lo quiere|no quiere|no le interesa|no lo requiere|no por el momento|dejo de operar|sobreendeudar/, 'Cliente','Ya no lo quiere / no por el momento'],
  [/espera|pospone|temporada|meses|fin de mes|liquidar|tramite|ella se comunica/, 'Cliente','Pospone / se espera'],
];
function clasifica(txt){const m=norm(txt);for(const [re,cat,mot] of REGLAS)if(re.test(m))return {cat,motivo:typeof mot==='function'?mot(m):mot};return {cat:CAT_SC,motivo:'Sin motivo especificado'};}
/* Solo estas columnas se guardan. Todo lo demás del export (RFC, teléfono, domicilio, buró) se descarta al cargar. */
const COLS={
  id:['solicitudid'], nombre:['prospectos','prospecto','nombre'], tipo:['tipo solicitud'], est:['estatus'], seg:['segmento'],
  aval:['necesita aval','aval?','aval'], refs:['necesita referencias','referencia?','referencias?','referencia'],
  etapa:['etapa'], xfecha:['fecha'], monto:['monto'], xmesa:['llego a mesa si/no','llego a mesa si / no','llego a mesa'], xfcm:['fecha compromiso mesa'], xcom:['comentario / descripcion','comentario'],
  fsol:['fecha solicitud'], sem:['semana'], fdes:['fecha desembolso'], suc:['sucursal'], safi:['saficreditoid'], asesor:['asesor']
};

/* ================= Utils ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
function hoyISO(){const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
function addDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
function dd(a,b){if(!a||!b)return 0;return Math.round((Date.parse(b+'T12:00:00')-Date.parse(a+'T12:00:00'))/864e5);}
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'],DOW=['dom','lun','mar','mié','jue','vie','sáb'];
function fmt(iso,dow=true){if(!iso)return '';const d=new Date(iso+'T12:00:00');return (dow?DOW[d.getDay()]+' ':'')+d.getDate()+' '+MES[d.getMonth()];}
function fmtTs(ts){const d=new Date(ts);return fmt(new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10))+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
const money=n=>'$'+Math.round(+n||0).toLocaleString('es-MX');
const pct=(a,b)=>b?Math.round(a*100/b)+'%':'—';
function toast(msg,ms=3500){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),ms);}
function toISODate(v,yearHint){
  if(v==null||v==='')return '';
  if(typeof v==='number'){if(v<20000||v>80000)return '';return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);}
  const s=String(v).trim();let m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/.exec(s);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  m=/^(\d{1,2})[\/-](\d{1,2})$/.exec(s);if(m&&+m[2]<=12)return (yearHint||new Date().getFullYear())+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return '';
}
/* Nombre abreviado: se guarda SOLO así (minimización de datos). "BERTHA ALICIA MUNIZ AVALOS" -> "Bertha A. Muniz A." */
const PART=new Set(['DE','DEL','LA','LAS','LOS','Y','SAN','SANTA','MC','VAN','VON']);
function tc(w){return w.toLowerCase().replace(/(^|[\s-])(\S)/g,(m,a,b)=>a+b.toUpperCase()).replace(/\b(De|Del|La|Las|Los|Y)\b(?=\s)/g,x=>x.toLowerCase()).replace(/^(\S)/,x=>x.toUpperCase());}
function abrevia(n){
  const raw=String(n||'').trim().toUpperCase().split(/\s+/).filter(Boolean);if(raw.length<2)return tc(raw.join(' '));
  const t=[];let pend='';for(const w of raw){if(PART.has(w)){pend+=(pend?' ':'')+w;continue;}t.push(pend?pend+' '+w:w);pend='';}if(pend)t.push(pend);
  if(t.length===1)return tc(t[0]);
  if(t.length===2)return tc(t[0])+' '+t[1][0]+'.';
  const nombres=t.slice(0,t.length-2),ap=t[t.length-2],am=t[t.length-1];
  return [tc(nombres[0]),...nombres.slice(1).map(x=>x.split(' ').pop()[0]+'.'),tc(ap),am.split(' ').pop()[0]+'.'].join(' ');
}
const segL=s=>{const m=/ACEPTADO\s+([ABC])/i.exec(s||'');return m?m[1].toUpperCase():'';};
const siNo=v=>/^s/i.test(norm(v))?'Sí':(v?'No':'');

/* ================= XLSX (sin librerías) ================= */
async function unzip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf),td=new TextDecoder();
  let e=-1;for(let i=u8.length-22;i>=Math.max(0,u8.length-70000);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break;}}
  if(e<0)throw new Error('El archivo no parece un .xlsx válido');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    files[td.decode(u8.subarray(p+46,p+46+nl))]={method,csize,lo};p+=46+nl+xl+cl;
  }
  return {names:Object.keys(files),async read(name){
    const f=files[name];if(!f)return null;
    const st=f.lo+30+dv.getUint16(f.lo+26,true)+dv.getUint16(f.lo+28,true);const data=u8.subarray(st,st+f.csize);let out;
    if(f.method===0)out=data;
    else if(f.method===8){out=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());}
    else throw new Error('Compresión no soportada');
    return new TextDecoder('utf-8').decode(out).replace(/^﻿/,'');
  }};
}
function dx(s){return s.replace(/&(lt|gt|amp|quot|apos|#x[0-9a-f]+|#\d+);/gi,(m,g)=>{const k=g.toLowerCase();if(k==='lt')return '<';if(k==='gt')return '>';if(k==='amp')return '&';if(k==='quot')return '"';if(k==='apos')return "'";return String.fromCodePoint(k[1]==='x'?parseInt(k.slice(2),16):parseInt(k.slice(1)));});}

function aCls(d){return d>30?'30':d>14?'15':d>7?'8':'0';}
function estadoPills(s){

  else if(s.cierre==='desPC')h+=`<span class="pill des">✔ Desembolsado</span><span class="pill flag">por confirmar en sistema</span>`;
  else if(s.cierre==='rech')h+=`<span class="pill rech">✖ ${esc(s.rech.motivo)}</span>`;
  else if(s.sinGestion)h+=`<span class="pill et0">Sin gestión</span>`;
  else h+=`<span class="pill et">${esc(s.etapa)}${s.falta?' · '+esc(s.falta):''}</span>`;
  if(s.fprog&&s.abierto)h+=`<span class="pill ${s.venc?'venc':'fok'}">${s.venc?'⚠ vencido ':s.hoyC?'hoy ':''}${fmt(s.fprog)}</span>`;
  if(s.repros)h+=`<span class="pill ${s.repros>=3?'rep3':'rep'}">↻ ${s.repros} ${s.repros===1?'vez':'veces'}</span>`;
  if(s.sisMesa&&s.abierto)h+=`<span class="pill sis">Sistema: en mesa</span>`;
  if(s.conflicto)h+=`<span class="pill flag">⚠ estaba rechazado</span>`;
  if(s.abierto&&!s.sinGestion&&s.sinMov>=3)h+=`<span class="pill flag">${s.sinMov}d sin mov.</span>`;
  return h;
}

  sh.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>b.closest('.form').classList.remove('on'));
  // etapa
  const syncEt=()=>{const cfg=ETAPAS[$('#e_etapa').value];$('#e_fechaW').hidden=cfg.fecha==='no';$('#e_fechaL').textContent=cfg.fecha==='req'?'Fecha compromiso':'Fecha compromiso (opcional)';$('#e_comL').textContent=cfg.comReq?'¿Qué pasó? (obligatorio)':'Comentario (opcional)';};
  $('#e_etapa').onchange=syncEt;syncEt();
  $('#e_ok').onclick=()=>{
    const etapa=$('#e_etapa').value,cfg=ETAPAS[etapa],fecha=cfg.fecha==='no'?'':$('#e_fecha').value,com=$('#e_com').value.trim();
    if(cfg.fecha==='req'&&!fecha)return $('#e_err').textContent='Pon la fecha compromiso';
    if(cfg.comReq&&!com)return $('#e_err').textContent='Explica qué pasó';
    if(fecha&&fecha<HOY)return $('#e_err').textContent='La fecha no puede ser pasada';
    if(etapa===s.etapa&&fecha&&s.fprog&&fecha!==s.fprog)return $('#e_err').textContent='Es la misma etapa con otra fecha: usa ↻ Reprogramar';
    const e={t:'etapa',etapa,fprog:fecha};if(com)e.com=com;
    addEv(id,e);done('Guardado');
  };
  // repro
  const syncR=()=>{$('#r_req').textContent=$('#r_mot').value==='Otro'?'(obligatorio)':'(opcional)';};$('#r_mot')&&($('#r_mot').onchange=syncR);syncR();
  $('#r_ok')&&($('#r_ok').onclick=()=>{
    const f=$('#r_fecha').value,m=$('#r_mot').value,com=$('#r_com').value.trim();
    if(!f)return $('#r_err').textContent='Pon la nueva fecha';
    if(f<HOY)return $('#r_err').textContent='La fecha no puede ser pasada';
    if(f===s.fprog)return $('#r_err').textContent='Es la misma fecha que ya tenía';
    if(!m)return $('#r_err').textContent='Selecciona el motivo';
    if(m==='Otro'&&!com)return $('#r_err').textContent='Explica el motivo en el comentario';
    const e={t:'repro',etapa:s.etapa,prev:s.fprog,fprog:f,motivo:m};if(s.falta)e.falta=s.falta;if(com)e.com=com;
    addEv(id,e);done('↻ Reprogramado ('+(s.repros+1)+(s.repros?' veces':' vez')+')');
  });
  // reasignar
  if($('#a_ok')){
    $('#a_mot').onchange=()=>{$('#a_req').textContent=$('#a_mot').value==='Otro'?'(obligatorio)':'(opcional)';};
    $('#a_ok').onclick=()=>{
      const a=$('#a_nuevo').value.trim().toUpperCase(),m=$('#a_mot').value,com=$('#a_com').value.trim();
      if(!a)return $('#a_err').textContent='Escribe el nuevo asesor';
      if(a===s.asesorAct)return $('#a_err').textContent='Es el mismo asesor';
      if(!m)return $('#a_err').textContent='Selecciona el motivo';
      if(m==='Otro'&&!com)return $('#a_err').textContent='Explica el motivo';
      const e={t:'reasig',de:s.asesorAct,a,motivo:m};if(com)e.com=com;addEv(id,e);done('↔ Reasignada a '+a);
    };
  }
  // comentario
  $('#c_ok').onclick=()=>{const com=$('#c_com').value.trim();if(!com)return $('#c_err').textContent='Escribe el comentario';addEv(id,{t:'com',com});done('Comentario guardado');};
  // desembolso
  $('#d_ok')&&($('#d_ok').onclick=()=>{const m=+$('#d_monto').value||0,com=$('#d_com').value.trim();if(m<0)return $('#d_err').textContent='Monto inválido';const e={t:'des'};if(m)e.monto=m;if(com)e.com=com;addEv(id,e);done('✔ Desembolsado');});
  // rechazo
  const syncX=()=>{$('#x_mot').innerHTML='<option value="">— Selecciona —</option>'+RECH[$('#x_cat').value].map(x=>`<option>${x}</option>`).join('');syncX2();};
  const syncX2=()=>{$('#x_req').textContent=$('#x_mot').value==='Otro'?'(obligatorio)':'(opcional)';};
  if($('#x_cat')){$('#x_cat').onchange=syncX;$('#x_mot').onchange=syncX2;syncX();}
  $('#x_ok')&&($('#x_ok').onclick=()=>{
    const cat=$('#x_cat').value,m=$('#x_mot').value,com=$('#x_com').value.trim();
    if(!m)return $('#x_err').textContent='Selecciona el motivo';
    if(m==='Otro'&&!com)return $('#x_err').textContent='Explica el motivo en el comentario';
    const e={t:'rech',cat,motivo:m,llegoMesa:s.mesa||cat===CAT_MESA};if(com)e.com=com;addEv(id,e);done('Cuenta rechazada');
  });
  function done(msg){toast('✔ '+msg);render();openDetalle(id);}
}

/* ================= Concentrado ================= */
const C={sem:''};
function metr(arr){
  const m={acept:arr.length,sc:0,conf:0,des:0,desPC:0,perfil:0,mesaR:0,cli:0,otro:0,ab:0,a15:0,a30:0,venc:0,rep:0,sing:0,sinMesa:0};
  for(const s of arr){
    if(s.cierre==='des')m.des++;else if(s.cierre==='desPC'){m.des++;m.desPC++;}
    else if(s.cierre==='rech'){const c=s.rech.cat;if(c===CAT_PERFIL)m.perfil++;else if(c===CAT_MESA)m.mesaR++;else if(c==='Cliente')m.cli++;else m.otro++;if(c===CAT_SC)m.sc++;if(!s.mesa&&(!s.rech.hist||s.rech.mesaNo))m.sinMesa++;}
    if(s.conflicto)m.conf++;
    if(s.abierto){m.ab++;if(s.dias>30)m.a30++;else if(s.dias>14)m.a15++;if(s.venc)m.venc++;if(s.repros>=2)m.rep++;if(s.sinGestion)m.sing++;}
  }
  m.rech=m.perfil+m.mesaR+m.cli+m.otro;return m;
}
function renderConc(){
  const all0=visibles();
  if(!all0.length){$('#vConc').innerHTML='<div class="empty">Carga primero el export del funnel.</div>';return;}
  const sems=[...new Set(all0.map(s=>s.c.sem))].filter(Boolean).sort().reverse();
  if(C.sem&&!sems.includes(C.sem))C.sem='';
  const all=all0.filter(s=>!C.sem||s.c.sem===C.sem);
  const T=metr(all);
  const grp=(key)=>{const g={};all.forEach(s=>{const k=key(s)||'(sin dato)';(g[k]=g[k]||[]).push(s);});return g;};
  const bySuc=grp(s=>s.c.suc),byAse=grp(s=>s.asesorAct),bySeg=grp(s=>s.seg?'Aceptado '+s.seg:'');
  const rowSuc=(name,m,tot)=>`<tr class="${tot?'tot':''}"><td>${esc(name.replace('CI-',''))}</td><td>${m.acept}</td><td>${m.des}</td><td>${pct(m.des,m.acept)}</td><td>${m.rech}</td><td class="${m.perfil?'hw':''}">${m.perfil}</td><td>${m.ab}</td><td class="${m.a15?'hw':''}">${m.a15}</td><td class="${m.a30?'hb':''}">${m.a30}</td><td class="${m.venc?'hb':''}">${m.venc}</td><td class="${m.rep?'hw':''}">${m.rep}</td><td>${m.sing}</td></tr>`;
  const sucRows=Object.keys(bySuc).sort().map(k=>rowSuc(k,metr(bySuc[k]))).join('');
  const quit={};all.forEach(s=>s.evs.forEach(e=>{if(e.t==='reasig')quit[e.de]=(quit[e.de]||0)+1;}));
  const ases=[...new Set([...Object.keys(byAse),...Object.keys(quit)])].map(k=>({k,m:metr(byAse[k]||[]),suc:(byAse[k]||all.filter(s=>s.evs.some(e=>e.de===k)))[0].c.suc,q:quit[k]||0})).sort((a,b)=>(b.m.perfil-a.m.perfil)||(b.m.ab-a.m.ab));
  const mot={};all.filter(s=>s.cierre==='rech').forEach(s=>{const k=s.rech.motivo+(s.rech.cat===CAT_PERFIL||s.rech.cat===CAT_SC?'':' ('+s.rech.cat.split(' ')[0].toLowerCase()+')');mot[k]=(mot[k]||0)+1;});
  const motA=Object.entries(mot).sort((a,b)=>b[1]-a[1]);const motMax=motA[0]?.[1]||1;
  const segRows=Object.keys(bySeg).sort().map(k=>{const m=metr(bySeg[k]);return `<tr><td>${esc(k)}</td><td>${m.acept}</td><td>${m.des}</td><td>${pct(m.des,m.acept)}</td><td>${m.perfil}</td><td>${m.ab}</td></tr>`;}).join('');
  $('#vConc').innerHTML=`
  <div class="frow"><select id="cSem"><option value="">Todas las semanas de solicitud</option>${sems.map(x=>`<option ${C.sem===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
  <div class="kpis">
    <div class="kpi"><b>${T.acept}</b><span>Aceptados</span></div>
    <div class="kpi"><b style="color:var(--ok)">${pct(T.des,T.acept)}</b><span>Conversión (${T.des})</span></div>
    <div class="kpi ${T.perfil?'warn':''}"><b>${T.perfil}</b><span>Rech. por perfil</span></div>
    <div class="kpi ${T.a30?'bad':''}"><b>${T.ab}</b><span>Abiertos (${T.a30} +30d)</span></div>
  </div>
  <div class="panel"><h3>Por sucursal</h3><div class="tw"><table>
    <tr><th></th><th>Acept.</th><th>Desemb.</th><th>Conv.</th><th>Rech.</th><th>Perfil</th><th>Abiertos</th><th>15-30d</th><th>+30d</th><th>Venc.</th><th>↻2+</th><th>Sin gest.</th></tr>
    ${sucRows}${VISTA==='GP'?rowSuc('Total región',T,true):''}
  </table></div>
  <p class="note">Por asesor se cuenta con el asesor actual (después de reasignar). <b>↔ Quitadas</b> = cuentas que se le reasignaron a otro.</p>
  <p class="note"><b>Perfil</b> = rechazado por gerente/asesor (no cumplía el perfil: ¿por qué se consultó?). <b>Venc.</b> = fecha compromiso ya pasada. ${T.sinMesa?`<b>${T.sinMesa}</b> rechazos sin llegar a mesa.`:''}${T.desPC?` <b>${T.desPC}</b> desembolsos por confirmar en sistema.`:''}${T.conf?` <b style="color:var(--bad)">${T.conf}</b> cuentas rechazadas que el sistema marca desembolsadas.`:''}${T.sc?` <b>${T.sc}</b> rechazos históricos sin motivo especificado.`:''}</p></div>
  <div class="panel"><h3>Por segmento</h3><div class="tw"><table><tr><th></th><th>Acept.</th><th>Desemb.</th><th>Conv.</th><th>Perfil</th><th>Abiertos</th></tr>${segRows}</table></div></div>
  <div class="panel"><h3>Motivos de rechazo</h3>${motA.length?`<div class="bars">${motA.slice(0,12).map(([k,n])=>`<div class="b"><span class="l" title="${esc(k)}">${esc(k)}</span><span class="t"><i style="width:${n*100/motMax}%;background:${/\(/.test(k)?'#94a3b8':'#d97706'}"></i></span><span class="n">${n}</span></div>`).join('')}</div><p class="note">Naranja = perfil (gerente/asesor) · Gris = mesa / cliente / otro</p>`:'<p class="note">Aún no hay rechazos capturados.</p>'}</div>
  <div class="panel"><details ${VISTA!=='GP'?'open':''}><summary>Por asesor (${ases.length})</summary><div class="tw" style="margin-top:8px"><table>
    <tr><th>Asesor</th>${VISTA==='GP'?'<th>Suc.</th>':''}<th>Acept.</th><th>Desemb.</th><th>Conv.</th><th>Perfil</th><th>% perfil</th><th>Abiertos</th><th>+30d</th><th>↔ Quitadas</th></tr>
    ${ases.map(a=>`<tr><td>${esc(a.k)}</td>${VISTA==='GP'?`<td>${esc(a.suc.replace('CI-',''))}</td>`:''}<td>${a.m.acept}</td><td>${a.m.des}</td><td>${pct(a.m.des,a.m.acept)}</td><td class="${a.m.perfil?'hw':''}">${a.m.perfil}</td><td class="${a.m.acept&&a.m.perfil/a.m.acept>=.2?'hb':''}">${pct(a.m.perfil,a.m.acept)}</td><td>${a.m.ab}</td><td class="${a.m.a30?'hb':''}">${a.m.a30}</td><td class="${a.q?'hw':''}">${a.q}</td></tr>`).join('')}
  </table></div></details></div>`;
  $('#cSem').onchange=e=>{C.sem=e.target.value;renderConc();};
}

reindex();fillVista();
if(SES&&SES.perfil){aplicaPerfil();render();sincroniza(false);}else{render();showLogin();}
// Copia guardada para abrir aunque no haya señal (mismo esquema que la Agenda del Asesor)
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
